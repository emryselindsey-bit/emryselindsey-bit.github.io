<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emrys Lindsey | Engineering Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#E4F0E1;--panel:#F5FAF3;--ink:#0A2018;--mute:#35574A;--deep:#0B3D2E;--mid:#1F7A4D;--pop:#B8F26B;--line:#8FB9A0;--onDeep:#EAF6E6;
--head:"Chakra Petch","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07150F;--panel:#0E2219;--ink:#E3F3DF;--mute:#9CC4AE;--deep:#04120C;--mid:#3FB874;--pop:#B8F26B;--line:#24523D;--onDeep:#EAF6E6}}
:root[data-theme="dark"]{--bg:#07150F;--panel:#0E2219;--ink:#E3F3DF;--mute:#9CC4AE;--deep:#04120C;--mid:#3FB874;--pop:#B8F26B;--line:#24523D;--onDeep:#EAF6E6}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--pop);outline-offset:3px}
.w{max-width:1100px;margin:0 auto;padding:0 22px}
.top{background:var(--deep);color:var(--onDeep);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--pop)}
.top .w{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.logo{font:700 1.15rem var(--head);letter-spacing:.08em;text-decoration:none;text-transform:uppercase}.logo b{color:var(--pop)}
nav{display:flex;gap:6px}nav a{font:600 .85rem var(--head);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:8px 18px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);background:#ffffff14}
nav a:hover,nav a.on{background:var(--pop);color:#0A2018}
.hero{background:var(--deep) repeating-linear-gradient(135deg,#ffffff0a 0 2px,transparent 2px 18px);color:var(--onDeep);clip-path:polygon(0 0,100% 0,100% calc(100% - 48px),0 100%);padding:56px 0 110px}
.hero .w{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center}
.kick{font:600 .85rem var(--head);letter-spacing:.2em;text-transform:uppercase;color:var(--pop);margin:0 0 10px}
h1{font:700 clamp(2.4rem,6vw,4.4rem)/1 var(--head);margin:0 0 18px;text-transform:uppercase;letter-spacing:.01em}
.hero p{max-width:34em;margin:0 0 14px}
.btn{display:inline-block;font:700 .9rem var(--head);letter-spacing:.1em;text-transform:uppercase;background:var(--pop);color:#0A2018;padding:12px 28px;text-decoration:none;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.hex{width:100%;max-width:300px;justify-self:center;aspect-ratio:1;background:var(--pop);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);display:grid;place-items:center}
.hex div{width:92%;height:92%;background:var(--deep);clip-path:inherit;display:grid;place-items:center;text-align:center;font:700 1rem var(--head);letter-spacing:.1em;color:var(--pop)}
.hex span{display:block;font-size:2.6rem;color:var(--onDeep)}
h2{font:700 1.7rem var(--head);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}h2::before{content:"";display:inline-block;width:14px;height:14px;background:var(--mid);transform:rotate(45deg);margin-right:12px}
.sub{color:var(--mute);margin:0 0 24px;max-width:42em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;margin-top:-50px;position:relative}
.card{display:block;text-decoration:none;background:var(--panel);border:2px solid var(--deep);clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px));position:relative;transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card .im{height:190px;background:var(--deep) center/cover no-repeat;border-bottom:4px solid var(--pop);position:relative}
.card .n{position:absolute;left:0;top:0;background:var(--pop);color:#0A2018;font:700 1rem var(--head);padding:4px 16px 4px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.card .tx{padding:16px 22px 22px}.card h3{font:700 1.2rem/1.2 var(--head);margin:0 0 4px;text-transform:uppercase}
.tag{font:600 .75rem var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.card p{margin:8px 0 0;font-size:.95rem;color:var(--mute)}
section{padding:46px 0}
.chip{display:inline-block;background:var(--deep);color:var(--onDeep);font:500 .8rem var(--head);padding:3px 14px;margin:0 6px 6px 0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.pg{padding:34px 0 60px}.back{font:600 .85rem var(--head);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--mid)}
.pg h1{color:var(--ink);font-size:clamp(2rem,5vw,3.3rem);margin:12px 0 10px}
.ph{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;margin:14px 0 30px}
.ph .im{background:var(--panel) center/contain no-repeat;border:2px solid var(--deep);border-left:10px solid var(--pop);min-height:300px}
.box{background:var(--panel);border:2px solid var(--deep);padding:22px 26px 18px;margin:0 0 20px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
.box h2{font-size:1.2rem}.box ul{padding-left:20px;margin:8px 0}.box li{margin:6px 0}.box p{margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:20px}
footer{background:var(--deep);color:var(--onDeep);padding:30px 0 40px;margin-top:30px;border-top:4px solid var(--pop)}
@media (max-width:780px){.hero .w,.ph,.two,.about{grid-template-columns:1fr}.hex{max-width:190px;justify-self:start}.logo{font-size:.95rem}nav a{padding:8px 11px}}
</style></head><body>

{id:"gravity-car",t:"Earl of Destruction: Gravity Car",tag:"Dynamics · Modelling · Wind tunnel",img:"car",when:"EGR 244L, Spring 2026",sum:"A 3D-printed gravity car with three levels of physics models and measured drag and inertia.",
role:"Vehicle design and fabrication, testing, cover page, and the design section of the report, on a team of three.",
ov:["Goal: convert gravitational potential energy into speed on the Duke Gravity Car Track and predict the race time before racing.","Design: teardrop chassis (174.88 mm × 67.5 mm, 16° taper, filleted) with an overhang that shields the wheels, 1.35 mm wheel clearance, bearing-mounted 5 mm axles, and nearly solid lightweight wheels to cut rotational inertia. A 40 g mass sits low and rearward, inserted by pausing the 3D print mid-build so it is fully enclosed. Final mass 141 g. A printed alignment fixture held bearings, wheels and axle during assembly.","Models: Model 0 (lossless particle, 1.386 s), Model 1 (rigid body with wheel inertia, 1.411 s), and a final Lagrangian model with linear drag, nonlinear rolling resistance and normal loads that depend on center-of-gravity position (1.733 s)."],
test:["Drag: measured on the Duke wind tunnel force balance at 5, 10, 15 and 20 m/s. A linear fit gave D = 0.0267 kg/s with R² = 1.","Wheel inertia: tried a pulley-and-falling-mass method (1.40e-7 kg·m²) but found the narrow test shaft rotated eccentrically, so the result was likely too low. Used the CAD-and-measured-mass value (2.75e-7 kg·m²) instead.","Center of gravity: computed from component masses and positions.","Design sweeps: MATLAB heatmaps of finish time against wheel inertia, mass, CG position and wheel radius guided the design. Python and MATLAB ODE solvers produced the final predictions.","Track trials: four runs on the real track."],
qual:["Lagrangian mechanics applied to a real system, and solving equations of motion numerically in MATLAB and Python.","Designing experiments, and questioning my own method when the pulley inertia test turned out biased.","That an unmeasured assumption, like rolling resistance, can dominate prediction error.","Designing 3D-printed parts with enclosed masses, fixtures and tight clearances."],
res:"The car did not finish: in all four trials it stopped about two-thirds of the way down the track, so there is no measured time to compare with the 1.73 s prediction. The report traces this to PLA-on-bearing friction and an assumed rolling-resistance coefficient (0.02) that was never measured. That gap is the main lesson: a model is only as good as the measured parameters behind it.",
stack:["MATLAB","Python","SolidWorks/3D printing","Wind tunnel","Lagrangian dynamics"]},

function about(){app.innerHTML=`<div class="w pg"><span class="tag">Get to know me</span><h1>About Emrys</h1><div class="about"><div class="box"><h2>Bio</h2><p>I’m Claire, and I go by Emrys. I’m a junior at Duke studying mechanical engineering with an aerospace certificate (class of 2028). I grew up in Seneca, South Carolina, where I was valedictorian and did FIRST Robotics. Before college I shadowed a materials engineering professor at Clemson, helping grade assignments and sitting in on classes.</p><p>At Duke I’m on DukeAERO and SEDS USA, in a Bass Connections group on asteroid science and planetary defense, and a STEM peer tutor through DukeLIFE.</p></div>
